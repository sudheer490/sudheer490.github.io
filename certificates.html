    <header>

    <section class="certificates">

        <div class="certificates-container">
            <a href="assets/certificates/tiger_certified analytics associate.pdf" target="_blank">

            </a>
            <a href="assets/certificates/Deep Learning Specialization.pdf" target="_blank">
                <img src="assets/certificates/deep learning.png" alt="Certificate 2" class="certificate">
            </a>
            <a href="assets/certificates/Applied Data Science.pdf" target="_blank">

            </a>

              <img src="assets/certificates/ml.png" alt="Certificate 3" class="certificate">

          <a href="assets/certificates/Introduction to Tensorflow for AI,ML and DL.pdf" target="_blank">

        <a href="assets/certificates/CertificateOfCompletion_Agile Foundations.pdf" target="_blank">
          <img src="assets/certificates/agile.png" alt="Certificate 3" class="certificate">
      </a>
            <!-- Add more certificates as needed -->

    <script src="./assets/js/script.js"></script>

</html>
